# ============================================================
#  npm-publish.yml — Publish to npm when a GitHub release is created
#
#  Triggers:
#    - GitHub release published (any version)
#
#  Steps:
#    1. Checkout code at the release tag
#    2. Install dependencies
#    3. Security audit
#    4. Build CSS artifacts
#    5. Run tests
#    6. Publish to npm with provenance
# ============================================================
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Security audit
        run: yarn npm audit --all --recursive --severity moderate
        continue-on-error: true

      - name: Validate npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build CSS artifacts
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
