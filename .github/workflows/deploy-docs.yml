# ============================================================
#  deploy-docs.yml — Build docs site and deploy to docs branch
#
#  On push to main:
#    1. Builds CSS artifacts (framework + docs)
#    2. Syncs versions.json from git tags
#    3. Builds Astro docs site (with Tailwind CSS v4)
#    4. Force-pushes the built output to the 'docs' branch
#
#  GitHub Pages serves from the 'docs' branch.
# ============================================================
name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Build CSS artifact (npm)
        run: yarn build:css

      - name: Build docs CSS (utilities only, no reset)
        run: bash scripts/build-docs-css.sh

      - name: Sync versions.json from git tags
        run: bash scripts/sync-versions.sh

      - name: Build Astro docs site (with Tailwind CSS)
        run: npx astro build --root site

      - name: Deploy to docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: docs
          publish_dir: ./site/dist
          force_orphan: true
