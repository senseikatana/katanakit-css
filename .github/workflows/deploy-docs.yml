# ============================================================
#  deploy-docs.yml — Deploy documentation to GitHub Pages
#
#  Triggers:
#    - Push to main  → builds and deploys latest docs
#    - Push tag v*   → builds docs + snapshots under /versions/<tag>/
#    - Manual dispatch
#
#  The versioned snapshot is a frozen copy of the docs at the
#  moment of the release. It never changes when main is updated.
# ============================================================
name: Deploy Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git tag list

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Build CSS artifact
        run: yarn build:css

      - name: Sync versions.json from git tags
        run: bash scripts/sync-versions.sh

      - name: Build documentation site
        run: npx astro build --root site

      # When pushing a tag, copy the build as a frozen version snapshot.
      - name: Snapshot versioned docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          SAFE=$(echo "$TAG" | tr '.' '-')
          DEST="site/dist/versions/$SAFE"
          mkdir -p "$DEST"
          # Copy the built site into the versioned directory.
          # Exclude the versions/ dir itself to avoid recursion.
          for item in index.html getting-started core utilities mixins reference es _astro pagefind favicon.svg; do
            [ -e "site/dist/$item" ] && cp -r "site/dist/$item" "$DEST/"
          done
          echo "✓ Snapshot saved to $DEST"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
