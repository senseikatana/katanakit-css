# ============================================================
#  deploy-docs.yml — Build Docusaurus docs and deploy to gh-pages
#
#  On push to main:
#    1. Builds CSS artifact (npm package)
#    2. Builds Docusaurus site (docs/)
#    3. Deploys docs/build to gh-pages branch
# ============================================================
name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CSS artifact (npm)
        run: pnpm build:css

      - name: Install docs dependencies
        run: cd docs && pnpm install --frozen-lockfile

      - name: Build Docusaurus site
        run: cd docs && pnpm build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/build
          force_orphan: true
