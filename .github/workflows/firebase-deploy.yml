# ============================================================
#  firebase-deploy.yml — Build demo and deploy to Firebase Hosting
#
#  On push to main:
#    1. Builds CSS artifact (npm package)
#    2. Builds Vite demo site (demo/ → demo/dist/)
#    3. Deploys demo/dist to Firebase Hosting (live channel)
#
#  Required secret: FIREBASE_SERVICE_ACCOUNT_KATANAKIT_CSS
#  (JSON key of github-action-deployer@katanakit-css service account)
# ============================================================
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CSS artifact
        run: pnpm build:css

      - name: Build demo site
        run: pnpm demo:build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KATANAKIT_CSS }}
          channelId: live
          projectId: katanakit-css
